[project]
name = "flet-lumen-vision"
version = "0.1.0"
description = "Life of Legends on-device food photo classifier: a Flet extension wrapping tflite_flutter."
requires-python = ">=3.10"
dependencies = ["flet>=1.0.5,<2"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["flet_lumen_vision*", "flutter*"]

# Ship the Flutter package (Dart code + the TFLite model and labels as Flutter assets)
# inside the wheel as `flutter/flet_lumen_vision/...`. `flet build` (serious_python)
# copies every site-packages `flutter/<name>/` folder that has a pubspec.yaml into
# build/flutter-packages and adds it as a path dependency of the app.
[tool.setuptools.package-data]
"flutter.flet_lumen_vision" = ["**/*"]
