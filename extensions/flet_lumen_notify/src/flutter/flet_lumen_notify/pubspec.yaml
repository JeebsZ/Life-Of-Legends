name: flet_lumen_notify
description: Life of Legends local notifications (Flet extension wrapping flutter_local_notifications).
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter

  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.0

  # Only to set the global audio context (no audio-focus stealing, see README "Audio focus").
  # Already in the app through flet_audio (audioplayers ^6.6.0, resolved to 6.8.1), so this
  # adds no new package; keep the range compatible with what flet_audio pulls in.
  audioplayers: ">=6.6.0 <7.0.0"

  # The app's generated pubspec pins `flet` via dependency_overrides, so this
  # constraint only has to be compatible with it.
  flet: ">=1.0.5 <2.0.0"

flutter:
  # Declared as an Android plugin only so its android/ module (and with it the
  # AndroidManifest.xml that registers the flutter_local_notifications receivers)
  # is merged into the app. The Java class is a no-op.
  plugin:
    platforms:
      android:
        package: com.jarvin.flet_lumen_notify
        pluginClass: FletLumenNotifyPlugin
